<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тарих QA</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <main class="app">
    <header class="header">
      <div class="badge">
        <span class="dot"></span>
        Gemini · История Казахстана, 11 класс
      </div>
      <h1>Тарих<span class="accent">.</span>QA</h1>
      <p class="subtitle">Задай вопрос по учебнику истории Казахстана</p>
    </header>

    <section class="chips" id="chips"></section>

    <section class="chat-panel">
      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <p>Выбери вопрос выше или напиши свой — бот отвечает только на основе текста учебника.</p>
        </div>
      </div>

      <form class="composer" id="composer">
        <input
          id="input"
          type="text"
          placeholder="Например: Кто такой Ходжа Ахмед Яссауи?"
          autocomplete="off"
        />
        <button type="submit" id="send" aria-label="Отправить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </section>

    <footer class="footer">Ответы генерируются моделью и могут содержать ошибки</footer>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
